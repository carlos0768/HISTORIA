name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # pgvector 入りのイメージを使う。docs/schema.sql を置換せずそのまま流し、
      # HNSW インデックスまで含めて検証するため（PGVECTOR=off にしない）。
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # seed の CSV は DB へ入れる前にここで落とす（seed/README.md §6）
      - name: seed の検査
        run: node seed/validate.mjs

      - name: 型検査
        run: npx tsc --noEmit

      - name: テスト
        run: npx vitest run

      - name: ビルド
        run: npx next build
